<!--
  Favicon: the SC monogram and the satellite, on a square canvas.

  A FAVICON IS A 16px GLYPH, NOT A SHRUNKEN LOGO. logo-orbital.svg needs three
  elements to read - orbit, trail, monogram - and at 16px it has ~256 pixels to do
  that in; rendered at tab size it is an amber smudge. The company seal is worse: its
  ring text is unreadable below about 64px. Both were rendered at 16px and compared
  before this file was written.

  What survives the size is the monogram and the amber dot, both lifted unchanged
  from the mark in the hero and the footer, so this reads as the family's small-size
  form rather than a second logo. Square viewBox on purpose: a wide one letterboxes
  and the glyph shrinks again.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Seriously Cyber Consulting">
  <g transform="translate(32,40) scale(0.62)">
